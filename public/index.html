<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeatDownloader | MP3</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Fundo escuro estilo aplicativo de música */
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* O "Cartão" central */
        .container {
            background-color: #181818;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 90%;
            max-width: 400px;
            border: 1px solid #282828;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h2 {
            margin: 0 0 5px;
            font-weight: 800;
            letter-spacing: -1px;
            font-size: 28px;
        }

        p {
            color: #b3b3b3; /* Cinza claro clássico de apps de música */
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Caixa de texto arredondada */
        input {
            width: 85%;
            padding: 16px 20px;
            margin-bottom: 20px;
            background-color: #282828;
            border: 2px solid transparent;
            border-radius: 30px;
            color: white;
            font-size: 16px;
            font-family: inherit;
            outline: none;
            transition: 0.3s;
        }

        /* Efeito de brilho quando o usuário clica para digitar */
        input:focus {
            border-color: #1db954; /* Verde Spotify */
            background-color: #333;
        }

        /* Botão vibrante */
        button {
            background-color: #1db954; /* Verde Spotify */
            color: #000000;
            border: none;
            padding: 16px 30px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            font-family: inherit;
            transition: transform 0.2s, background-color 0.2s;
        }

        /* Efeito de aumentar levemente ao passar o mouse */
        button:hover {
            background-color: #1ed760;
            transform: scale(1.03);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Mensagem de carregamento escondida por padrão */
        .loading {
            display: none;
            margin-top: 20px;
            color: #1db954;
            font-weight: 600;
            font-size: 14px;
            animation: pulse 1.5s infinite;
        }

        /* Animação piscante para o carregamento */
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🎧</div>
        <h2>BeatDownloader</h2>
        <p>Baixe áudio em alta qualidade (MP3 128k)</p>
        
        <input type="text" id="linkInput" placeholder="Cole o link do vídeo aqui..." autocomplete="off">
        <button id="btnBaixar" onclick="baixarAudio()">Converter para MP3</button>
        
        <div id="loadingText" class="loading">⏳ Convertendo áudio... O download vai começar em breve!</div>
    </div>

    <script>
        function baixarAudio() {
            const link = document.getElementById('linkInput').value;
            const btn = document.getElementById('btnBaixar');
            const loading = document.getElementById('loadingText');

            if (!link) {
                alert('Por favor, cole um link primeiro!');
                return;
            }
            
            // 1. Muda a interface para o modo "Carregando"
            loading.style.display = 'block';
            btn.innerText = 'Aguarde...';
            btn.disabled = true;
            btn.style.opacity = '0.5';

            // 2. Manda o servidor fazer o download
            window.location.href = `/baixar?url=${encodeURIComponent(link)}`;

            // 3. Finge que está processando por 8 segundos, depois "reseta" a interface
            setTimeout(() => {
                loading.style.display = 'none';
                btn.innerText = 'Converter para MP3';
                btn.disabled = false;
                btn.style.opacity = '1';
                document.getElementById('linkInput').value = ''; // Limpa a caixa de texto
            }, 8000);
        }
    </script>

</body>
</html>
